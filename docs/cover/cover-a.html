<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; }
  body { background: #0b1220; color: #f8fafc; font-family: Inter, sans-serif; position: relative; }
  .glow { position: absolute; width: 1100px; height: 700px; right: -200px; bottom: -150px; background: radial-gradient(closest-side, rgba(34,197,94,.22), transparent); }
  .head { position: absolute; left: 90px; top: 90px; right: 90px; }
  h1 { font-size: 132px; line-height: 0.98; font-weight: 900; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #22c55e; }
  .chips { display: flex; gap: 16px; margin-top: 42px; }
  .chip { font-size: 27px; font-weight: 700; padding: 13px 24px; border-radius: 999px; border: 2px solid rgba(34,197,94,.55); color: #dcfce7; background: rgba(34,197,94,.1); }
  .frame { position: absolute; left: 90px; top: 560px; width: 1300px; height: 560px; border-radius: 20px; overflow: hidden; background: #fff; box-shadow: 0 40px 90px rgba(0,0,0,.55); border: 2px solid #1e293b; }
  .bar { height: 46px; background: #e2e8f0; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .bar i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .bar span { margin-left: 22px; height: 26px; width: 420px; border-radius: 8px; background: #fff; font-size: 15px; color: #64748b; display: flex; align-items: center; padding: 0 12px; font-weight: 600; }
  .shot { width: 100%; height: calc(100% - 46px); object-fit: cover; object-position: top left; display: block; }
  .alert { position: absolute; right: 90px; top: 905px; width: 560px; background: #fff; color: #0f172a; border-radius: 18px; padding: 26px 28px; box-shadow: 0 30px 70px rgba(0,0,0,.5); border-left: 10px solid #22c55e; }
  .alert .who { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 800; }
  .alert .av { width: 44px; height: 44px; border-radius: 10px; background: #16a34a; color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 900; }
  .alert .ch { color: #64748b; font-weight: 600; font-size: 18px; }
  .alert p { margin-top: 14px; font-size: 25px; line-height: 1.35; font-weight: 600; }
  .alert p b { color: #16a34a; }
  .tag { position: absolute; right: 90px; top: 98px; font-size: 20px; font-weight: 700; color: #94a3b8; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="tag">Built with Claude Code</div>
  <div class="head">
    <h1>Never Miss A<br><em>Customer Again</em></h1>
    <div class="chips">
      <div class="chip">Saved before anything else</div>
      <div class="chip">Auto retry and replay</div>
      <div class="chip">Checks every 15 min</div>
    </div>
  </div>
  <div class="frame">
    <div class="bar"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i><span>Reliability Guard</span></div>
    <img class="shot" src="../../clips/stills/dashboard_after_chaos.png" alt="">
  </div>
  <div class="alert">
    <div class="who"><div class="av">RG</div>Reliability Guard <span class="ch"># automation-alerts</span></div>
    <p>Reconciliation caught <b>3 silent misses</b>. All queued again and delivered.</p>
  </div>
</body>
</html>
