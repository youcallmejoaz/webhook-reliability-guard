<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.row { display: flex; align-items: center; gap: 40px; margin: 26px 0; }
.mark { width: 96px; height: 96px; border-radius: 24px; background: #dcfce7; display: grid; place-items: center; flex: none; }
.mark i { width: 44px; height: 24px; border-left: 10px solid #16a34a; border-bottom: 10px solid #16a34a; transform: rotate(-45deg) translate(4px, -4px); display: block; }
.row .t { font-size: 68px; font-weight: 800; letter-spacing: -0.01em; }
.row .d { font-size: 34px; color: #475569; margin-top: 4px; }
.kicker { animation-delay: 0.1s; } .r1 { animation-delay: 0.5s; } .r2 { animation-delay: 1.9s; } .r3 { animation-delay: 3.3s; }
</style></head><body>
  <div class="kicker in">Safeguards</div>
  <div class="row in r1"><div class="mark"><i></i></div><div><div class="t">Saved before anything else</div><div class="d">If saving fails, the store is told to send it again</div></div></div>
  <div class="row in r2"><div class="mark"><i></i></div><div><div class="t">No duplicates</div><div class="d">Retries and replays never create a second account or email</div></div></div>
  <div class="row in r3"><div class="mark"><i></i></div><div><div class="t">Claude explains, never changes settings</div><div class="d">It reads masked logs: first name and order number only</div></div></div>
</body></html>
